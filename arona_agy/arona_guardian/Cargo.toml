[package]
name = "arona_guardian"
version = "0.1.0"
edition = "2021"

[dependencies]
arona_memory = { path = "../arona_memory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"

[dev-dependencies]
arona_memory = { path = "../arona_memory", features = ["test-utils"] }
