[package]
name = "arona_cognition"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arona_memory = { path = "../arona_memory" }
candle-core = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }
thiserror = "1"
anyhow = "1"
rand = "0.8"

[features]
default = ["candle"]
candle = ["dep:candle-core", "dep:candle-transformers", "dep:tokenizers"]
cuda = ["candle", "candle-core/cuda", "candle-transformers/cuda"]

[[example]]
name = "generate"
required-features = ["candle"]

